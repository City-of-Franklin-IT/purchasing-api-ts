services:
  purchasing-api-ts:
    image: ghcr.io/city-of-franklin-it/purchasing-api-ts:1.0.2
    restart: unless-stopped
    environment:
      - BASE_URL=${BASE_URL}
      - HOST=${HOST}
      - PORT=${PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=${DB_HOST}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - POWER_AUTOMATE_WEBHOOK_URL=${POWER_AUTOMATE_WEBHOOK_URL}
      - LOG_LEVEL=${LOG_LEVEL}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    user: "1001:1001"
    volumes:
      - /opt/docs:/opt/docs:ro
    container_name: purchasing-api

  purchasing-mcp:
    image: ghcr.io/city-of-franklin-it/purchasing-mcp:1.0.0
    restart: unless-stopped
    environment:
      - MCP_HOST=${MCP_HOST}
      - MCP_PORT=${MCP_PORT}
      - DB_USERNAME=${MCP_DB_USERNAME}
      - DB_PASSWORD=${MCP_DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=${DB_HOST}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${MCP_ENTRA_CLIENT_ID}
      - ANTHROPIC_API_KEY=${MCP_ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${MCP_ANTHROPIC_MODEL}
    ports:
      - "127.0.0.1:${MCP_PORT}:${MCP_PORT}"
    user: "1001:1001"
    container_name: purchasing-mcp
